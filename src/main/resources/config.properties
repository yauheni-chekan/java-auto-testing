# =============================================================================
# Test Automation Framework Configuration
# =============================================================================

# Base URL for the application under test
base.url=https://www.inmotionhosting.com/

# =============================================================================
# Browser Configuration
# =============================================================================

# Browser type: chromium, firefox, webkit
browser.type=chromium

# Run tests in headless mode (true/false)
browser.headless=true

# Browser viewport dimensions
browser.viewport.width=1920
browser.viewport.height=1080

# Slow down operations by specified milliseconds (useful for debugging)
browser.slow.mo=0

# =============================================================================
# Timeout Configuration (in milliseconds)
# =============================================================================

# Default timeout for Playwright operations
timeout.default=30000

# Timeout for page navigation
timeout.navigation=60000

# Timeout for element interactions
timeout.element=10000

# =============================================================================
# Screenshot Configuration
# =============================================================================

# Take screenshot on test failure (true/false)
screenshot.on.failure=true

# Screenshot format: png, jpeg
screenshot.format=png

# Directory for screenshots (relative to project root)
screenshot.directory=target/screenshots

# =============================================================================
# Tracing Configuration
# =============================================================================

# Enable Playwright tracing (true/false)
tracing.enabled=false

# Tracing screenshots (true/false)
tracing.screenshots=true

# Tracing snapshots (true/false)
tracing.snapshots=true

# =============================================================================
# Retry Configuration
# =============================================================================

# Number of retries for flaky tests
retry.count=0

# =============================================================================
# Parallel Execution
# =============================================================================

# Number of parallel threads (0 = auto-detect based on CPU cores)
parallel.threads=0
